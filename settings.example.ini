# Shinsegae Christmas Photobooth - site settings (key=value)
# Launch.bat copies this file to settings.ini on first run and later adds
# only missing keys. Edit settings.ini on the site PC, not this file.
# Empty value = automatic / default. %VAR% is expanded in paths.

# Local web server port. The camera permission is stored per port.
server_port=8765

# Chrome. Empty chrome_path = auto-detect.
chrome_path=
# Dedicated profile (must be outside the project folder).
chrome_profile_dir=%LOCALAPPDATA%\ShinsegaePhotobooth\ChromeProfile
# true = full-screen kiosk (site). false = normal app window (testing).
kiosk=true
# Optional "x,y" of the target display, e.g. 1920,0 for a second monitor.
window_position=
# Optional "width,height", used only when kiosk=false.
window_size=

# OBS. Empty obs_path = auto-detect.
obs_path=
# Start OBS with the virtual camera when it is not running.
obs_autostart=true
# Shutdown.bat closes OBS only when true.
obs_stop_on_shutdown=false
