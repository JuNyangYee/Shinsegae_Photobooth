<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 외부 전송 없음: 같은 출처만 허용한다. MediaPipe 사용 통계 전송(odml.pa.googleapis.com)도 여기서 막힌다.
       wasm-unsafe-eval: MediaPipe WASM 컴파일에 필요
       img-src blob: 결과 사진(메모리 안 Object URL) 표시에 필요. 외부 출처는 아니다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinsegae Christmas Photobooth</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main id="stage" class="stage">
    <video id="preview" class="preview" autoplay muted playsinline></video>
    <!-- 사진 효과 미리보기 (유화 · 획). 영상 위를 덮는다. 효과를 쓸 수 없으면 숨겨 원본 미리보기가 보인다. -->
    <canvas id="effect" class="effect" hidden></canvas>
    <!-- 촬영 한 사이클 (기본 UI, 최종 디자인 아님): 결과 사진, 카운트다운 숫자, 촬영 순간 플래시 -->
    <img id="result" class="result" alt="" hidden>
    <p id="countdown" class="countdown" hidden></p>
    <div id="flash" class="flash"></div>
    <canvas id="dev-overlay" class="dev-overlay" hidden></canvas>
    <!-- 운영자용 인식 영역 편집 (R 키). 관람객 화면에는 보이지 않는다. -->
    <div id="tuning-layer" class="tuning-layer" hidden>
      <div class="tuning-region" data-region>
        <span class="tuning-handle" data-handle="nw"></span>
        <span class="tuning-handle" data-handle="n"></span>
        <span class="tuning-handle" data-handle="ne"></span>
        <span class="tuning-handle" data-handle="e"></span>
        <span class="tuning-handle" data-handle="se"></span>
        <span class="tuning-handle" data-handle="s"></span>
        <span class="tuning-handle" data-handle="sw"></span>
        <span class="tuning-handle" data-handle="w"></span>
      </div>
    </div>
    <p id="presence" class="presence" hidden></p>
    <p id="notice" class="notice" hidden></p>
    <!-- 운영자 표시: 자동 촬영 일시정지(P) 중 (config.showPauseIndicator로 끈다) -->
    <p id="pause-badge" class="pause-badge" hidden></p>
    <p id="status" class="status" hidden></p>
  </main>
  <pre id="dev-info" class="dev-info" hidden></pre>

  <!-- 운영자용 인식 범위 조절 (R 키로 열고 닫는다. Esc로도 닫는다.) -->
  <section id="tuning-panel" class="tuning-panel" data-dock="bottom" hidden>
    <header class="tuning-header">
      <strong>인식 범위 조절</strong>
      <span>R·Esc: 닫기 (저장하지 않은 변경은 취소)</span>
    </header>
    <p class="tuning-live" data-live></p>
    <p class="tuning-note" data-region-text></p>
    <label class="tuning-row">
      <span>최소 얼굴 크기 <small>(화면 높이 대비, 파란 가이드)</small></span>
      <input type="range" data-key="minFaceHeight">
      <output data-key="minFaceHeight"></output>
    </label>
    <label class="tuning-row">
      <span>최대 얼굴 크기 <small>(화면 높이 대비, 보라 가이드)</small></span>
      <input type="range" data-key="maxFaceHeight">
      <output data-key="maxFaceHeight"></output>
    </label>
    <label class="tuning-row">
      <span>최소 신뢰도</span>
      <input type="range" data-key="minScore">
      <output data-key="minScore"></output>
    </label>
    <details class="tuning-advanced">
      <summary>고급: 판정 시간</summary>
      <label class="tuning-row">
        <span>인식됨까지 유지 시간</span>
        <input type="range" data-key="presentHoldMs">
        <output data-key="presentHoldMs"></output>
      </label>
      <label class="tuning-row">
        <span>인식 안됨까지 유예 시간</span>
        <input type="range" data-key="absentGraceMs">
        <output data-key="absentGraceMs"></output>
      </label>
    </details>
    <div class="tuning-buttons">
      <button type="button" data-action="save">저장</button>
      <button type="button" data-action="revert">취소 (저장된 값으로)</button>
      <button type="button" data-action="defaults">기본값으로</button>
      <button type="button" data-action="dock">패널 위·아래</button>
      <button type="button" data-action="close">닫기</button>
    </div>
    <p class="tuning-state" data-state></p>
    <p class="tuning-message" data-message></p>
    <details class="tuning-json">
      <summary>현재값 JSON (복사용)</summary>
      <textarea data-json readonly rows="12" spellcheck="false"></textarea>
      <button type="button" data-action="copy">복사</button>
    </details>
  </section>

  <!-- 운영자용 사진 효과 조절 (E 키로 열고 닫는다. Esc로도 닫는다.) -->
  <section id="effect-panel" class="tuning-panel" data-dock="bottom" hidden>
    <header class="tuning-header">
      <strong>사진 효과 조절 (유화 · 획)</strong>
      <span>E·Esc: 닫기 (저장하지 않은 변경은 취소)</span>
    </header>
    <p class="tuning-note" data-live></p>
    <label class="tuning-row">
      <span>강도 <small>(요철·광택·결)</small></span>
      <input type="range" data-key="strength">
      <output data-key="strength"></output>
    </label>
    <label class="tuning-row">
      <span>붓 크기 <small>(획 굵기·간격·길이 배율)</small></span>
      <input type="range" data-key="size">
      <output data-key="size"></output>
    </label>
    <label class="tuning-row">
      <span>획 다시 그리기 <small>(그림마다 새로 칠하는 비율)</small></span>
      <input type="range" data-key="boil">
      <output data-key="boil"></output>
    </label>
    <label class="tuning-row">
      <span>초당 그림 <small>(스톱모션 느낌)</small></span>
      <input type="range" data-key="fps">
      <output data-key="fps"></output>
    </label>
    <label class="tuning-row">
      <span>색 보정</span>
      <input type="range" data-key="grade">
      <output data-key="grade"></output>
    </label>
    <label class="tuning-row">
      <span>세부 보존 문턱 <small>(낮을수록 세부를 더 살림)</small></span>
      <input type="range" data-key="refineThreshold">
      <output data-key="refineThreshold"></output>
    </label>
    <label class="tuning-row">
      <span>미리보기 처리 해상도 <small>(결과 대비. 느리면 초당 그림부터 낮춘다)</small></span>
      <input type="range" data-key="previewScale">
      <output data-key="previewScale"></output>
    </label>
    <div class="tuning-buttons">
      <button type="button" data-action="save">저장</button>
      <button type="button" data-action="revert">취소 (저장된 값으로)</button>
      <button type="button" data-action="defaults">기본값으로</button>
      <button type="button" data-action="dock">패널 위·아래</button>
      <button type="button" data-action="close">닫기</button>
    </div>
    <p class="tuning-state" data-state></p>
    <p class="tuning-message" data-message></p>
  </section>
</body>
</html>
