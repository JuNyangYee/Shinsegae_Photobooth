<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 외부 전송 없음: 같은 출처만 허용한다. MediaPipe 사용 통계 전송(odml.pa.googleapis.com)도 여기서 막힌다.
       wasm-unsafe-eval: MediaPipe WASM 컴파일에 필요
       img-src blob: 결과 사진(메모리 안 Object URL) 표시에 필요. 외부 출처는 아니다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinsegae Christmas Photobooth</title>
  <!-- 서체는 숨겨진 화면(카운트다운·결과)에서 처음 쓰여도 바로 보이도록 미리 받는다 -->
  <link rel="preload" href="assets/fonts/GowunBatang-Bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/GowunDodum-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main id="stage" class="stage">
    <video id="preview" class="preview" autoplay muted playsinline></video>
    <!-- 사진 효과 미리보기 (유화 · 획). 영상 위를 덮는다. 효과를 쓸 수 없으면 숨겨 원본 미리보기가 보인다. -->
    <canvas id="effect" class="effect" hidden></canvas>

    <!-- ---- 관람객 화면 (6-2, ui/guest-screen.js). 문구는 config/guest-text.js ---- -->
    <!-- 결과: 출력물 카드 (결과 사진), 안내, 남은 시간 -->
    <div id="result-view" class="result-view" hidden>
      <p id="result-title" class="result-title"></p>
      <div id="result-card" class="result-card">
        <div class="result-photo"><img id="result" class="result" alt="" decoding="async" hidden></div>
      </div>
      <p id="result-note" class="result-note"></p>
      <div id="result-timer" class="result-timer">
        <span class="result-timer-track"><span id="result-timer-fill" class="result-timer-fill"></span></span>
      </div>
      <p id="result-back" class="result-back"></p>
    </div>
    <!-- 준비 중·직원 문의 안내의 바탕 막. 장식 프레임은 그 위에 보인다 (안내 글자는 아래 #status) -->
    <div id="status-veil" class="status-veil" hidden></div>
    <!-- 장식 프레임: 가장자리 띠, 솔가지 가랜드·리본, 인식되면 밝아지는 테두리 빛 -->
    <div class="frame" aria-hidden="true">
      <div class="frame-glow"></div>
      <div class="frame-band"></div>
      <div class="frame-top"></div>
      <div class="frame-bottom"></div>
    </div>
    <!-- 대기 안내 -->
    <p id="guide" class="guide" hidden></p>
    <!-- 3·2·1: 숫자, 원형 진행(두 반원), 안내 -->
    <div id="countdown" class="countdown" hidden>
      <div id="countdown-dial" class="countdown-dial">
        <span class="countdown-ring">
          <span class="ring-half is-right"><span id="countdown-ring-a" class="ring-fill"></span></span>
          <span class="ring-half is-left"><span id="countdown-ring-b" class="ring-fill"></span></span>
        </span>
        <p id="countdown-number" class="countdown-number"></p>
      </div>
      <p id="countdown-caption" class="countdown-caption"></p>
    </div>
    <!-- 쿨타임 문구 -->
    <p id="notice" class="notice" hidden></p>
    <!-- 촬영 순간 플래시 -->
    <div id="flash" class="flash"></div>
    <canvas id="dev-overlay" class="dev-overlay" hidden></canvas>
    <!-- 운영자용 인식 영역 편집 (R 키). 관람객 화면에는 보이지 않는다. -->
    <div id="tuning-layer" class="tuning-layer" hidden>
      <div class="tuning-region" data-region>
        <span class="tuning-handle" data-handle="nw"></span>
        <span class="tuning-handle" data-handle="n"></span>
        <span class="tuning-handle" data-handle="ne"></span>
        <span class="tuning-handle" data-handle="e"></span>
        <span class="tuning-handle" data-handle="se"></span>
        <span class="tuning-handle" data-handle="s"></span>
        <span class="tuning-handle" data-handle="sw"></span>
        <span class="tuning-handle" data-handle="w"></span>
      </div>
    </div>
    <!-- 운영자 표시: 자동 촬영 일시정지(P) 중 (config.showPauseIndicator로 끈다). 관람객 눈에 덜 띄게 작게 -->
    <p id="pause-badge" class="pause-badge" hidden></p>
    <!-- 준비 중·직원 문의 안내 (관람객 화면). 확인 도구가 #status 글자로 안내를 읽는다. 바탕 막은 위 #status-veil -->
    <p id="status" class="status" hidden></p>
  </main>
  <!-- ---- 운영자 화면 (6-3). 관람객용이 아니다. 스타일은 style.css "운영자 화면" ---- -->
  <!-- 개발 정보 (D 키): 구역별 표. 줄 내용은 main.js, 표 모양은 ui/dev-panel.js -->
  <section id="dev-info" class="dev-info" aria-label="개발 정보" hidden></section>

  <!-- 운영자용 인식 범위 조절 (R 키로 열고 닫는다. Esc로도 닫는다.) -->
  <section id="tuning-panel" class="tuning-panel op-panel" data-dock="bottom" data-save="saved" aria-label="인식 범위 조절" hidden>
    <header class="op-header">
      <div class="op-heading">
        <h2 class="op-title">인식 범위 조절</h2>
        <p class="op-keys">R·Esc 닫기 · 저장하지 않은 변경은 닫을 때 취소</p>
      </div>
      <div class="op-header-buttons">
        <button type="button" data-action="dock" title="패널을 위·아래로 옮긴다">위·아래</button>
        <button type="button" data-action="close">닫기</button>
      </div>
    </header>
    <p class="op-live tuning-live" data-live></p>
    <div class="op-body">
      <fieldset class="op-group">
        <legend>영역</legend>
        <p class="op-help">화면의 금빛 사각형을 끌어 옮기고, 모서리·변으로 크기를 바꾼다. 얼굴 중심이 이 안에 있어야 인정한다.</p>
        <p class="op-readout" data-region-text></p>
      </fieldset>
      <fieldset class="op-group">
        <legend>얼굴 크기 <small>화면 높이 대비</small></legend>
        <label class="op-row">
          <span class="op-label"><i class="op-swatch is-min"></i>최소 얼굴 크기<small>청록 가이드보다 작으면 멀리 있는 것으로 보고 뺀다</small></span>
          <input type="range" data-key="minFaceHeight">
          <span class="op-value"><output data-key="minFaceHeight"></output><span class="op-unit">비율</span></span>
        </label>
        <label class="op-row">
          <span class="op-label"><i class="op-swatch is-max"></i>최대 얼굴 크기<small>분홍 가이드보다 크면 잘못 잡은 것으로 보고 뺀다</small></span>
          <input type="range" data-key="maxFaceHeight">
          <span class="op-value"><output data-key="maxFaceHeight"></output><span class="op-unit">비율</span></span>
        </label>
      </fieldset>
      <fieldset class="op-group">
        <legend>신뢰도</legend>
        <label class="op-row">
          <span class="op-label">최소 신뢰도<small>얼굴 감지 점수가 이보다 낮으면 뺀다</small></span>
          <input type="range" data-key="minScore">
          <span class="op-value"><output data-key="minScore"></output><span class="op-unit">점수</span></span>
        </label>
      </fieldset>
      <details class="op-group op-advanced">
        <summary>고급: 판정 시간</summary>
        <label class="op-row">
          <span class="op-label">인식됨까지 유지 시간<small>이만큼 계속 보여야 인식됨 (자동 촬영 시작)</small></span>
          <input type="range" data-key="presentHoldMs">
          <span class="op-value"><output data-key="presentHoldMs"></output></span>
        </label>
        <label class="op-row">
          <span class="op-label">인식 안됨까지 유예 시간<small>이만큼 계속 안 보여야 인식 안됨 (카운트다운 취소)</small></span>
          <input type="range" data-key="absentGraceMs">
          <span class="op-value"><output data-key="absentGraceMs"></output></span>
        </label>
      </details>
      <details class="op-group op-json">
        <summary>현재값 JSON (복사용)</summary>
        <textarea data-json readonly rows="10" spellcheck="false"></textarea>
        <button type="button" data-action="copy">복사</button>
      </details>
    </div>
    <footer class="op-footer">
      <p class="op-state" data-state></p>
      <div class="op-buttons">
        <button type="button" class="is-primary" data-action="save">저장</button>
        <button type="button" data-action="revert">취소 (저장된 값으로)</button>
        <button type="button" data-action="defaults">기본값으로</button>
      </div>
      <p class="op-message" data-message></p>
    </footer>
  </section>

  <!-- 운영자용 사진 효과 조절 (E 키로 열고 닫는다. Esc로도 닫는다.) -->
  <section id="effect-panel" class="tuning-panel op-panel" data-dock="bottom" data-save="saved" aria-label="사진 효과 조절" hidden>
    <header class="op-header">
      <div class="op-heading">
        <h2 class="op-title">사진 효과 조절</h2>
        <p class="op-keys">E·Esc 닫기 · 저장하지 않은 변경은 닫을 때 취소</p>
      </div>
      <div class="op-header-buttons">
        <button type="button" data-action="dock" title="패널을 위·아래로 옮긴다">위·아래</button>
        <button type="button" data-action="close">닫기</button>
      </div>
    </header>
    <p class="op-live" data-live></p>
    <div class="op-body">
      <fieldset class="op-group">
        <legend>효과 <small>유화 · 획</small></legend>
        <label class="op-row">
          <span class="op-label">강도<small>요철·광택·캔버스 결의 세기</small></span>
          <input type="range" data-key="strength">
          <span class="op-value"><output data-key="strength"></output><span class="op-unit">세기</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">붓 크기<small>획 굵기·간격·길이에 곱한다</small></span>
          <input type="range" data-key="size">
          <span class="op-value"><output data-key="size"></output><span class="op-unit">배</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">획 다시 그리기<small>그림마다 새로 칠하는 획 (0 고정 ~ 1 전부)</small></span>
          <input type="range" data-key="boil">
          <span class="op-value"><output data-key="boil"></output><span class="op-unit">비율</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">색 보정<small>따뜻한 색 보정을 섞는 정도</small></span>
          <input type="range" data-key="grade">
          <span class="op-value"><output data-key="grade"></output><span class="op-unit">비율</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">세부 보존 문턱<small>낮을수록 얼굴 등 세부를 더 살린다</small></span>
          <input type="range" data-key="refineThreshold">
          <span class="op-value"><output data-key="refineThreshold"></output><span class="op-unit">거리</span></span>
        </label>
      </fieldset>
      <fieldset class="op-group">
        <legend>출력 단계 <small>화면에 보이는 것이 곧 출력물</small></legend>
        <label class="op-row">
          <span class="op-label">출력 모드<small>감열지 = 흰 종이에 검은 점(1비트)</small></span>
          <select data-key="outputMode">
            <option value="thermal">감열지 (1비트 점)</option>
            <option value="gray">회색조</option>
            <option value="off">끔 (컬러 유화)</option>
          </select>
          <span class="op-value"><output data-key="outputMode"></output></span>
        </label>
        <label class="op-row">
          <span class="op-label">점 방식<small>톤 점·질감 강조 점에서 쓴다. 오차 확산(CPU)은 지글거리고 무겁다</small></span>
          <select data-key="dither">
            <option value="blue-noise">블루 노이즈 (GPU)</option>
            <option value="bayer">Bayer 순서 디더 (GPU)</option>
            <option value="atkinson">Atkinson 오차 확산 (CPU)</option>
            <option value="floyd-steinberg">Floyd–Steinberg 오차 확산 (CPU)</option>
          </select>
          <span class="op-value"><output data-key="dither"></output></span>
        </label>
        <label class="op-row">
          <span class="op-label">용지 폭<small>203dpi 감열지의 가로 점 수</small></span>
          <select data-key="paperDots">
            <option value="576">80mm · 576점</option>
            <option value="384">58mm · 384점</option>
          </select>
          <span class="op-value"><output data-key="paperDots"></output></span>
        </label>
        <label class="op-row">
          <span class="op-label">흑백 스타일<small>유화 느낌을 1비트에 남기는 방식 (감열지)</small></span>
          <select data-key="bwStyle">
            <option value="stroke">붓 결 선 (획마다 획 방향 선)</option>
            <option value="flow">흐름 선 (흐름을 따라 번진 결)</option>
            <option value="texture">질감 강조 점 (획 볼록 + 점 방식)</option>
            <option value="tone">톤 점 (질감 강조 없음)</option>
          </select>
          <span class="op-value"><output data-key="bwStyle"></output></span>
        </label>
        <label class="op-row">
          <span class="op-label">질감 세기<small>획 볼록 조명·국소 대비 (톤 점 제외)</small></span>
          <input type="range" data-key="bwTexture">
          <span class="op-value"><output data-key="bwTexture"></output><span class="op-unit">세기</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">선 간격<small>붓 결 선·흐름 선의 주기</small></span>
          <input type="range" data-key="lineSpacing">
          <span class="op-value"><output data-key="lineSpacing"></output><span class="op-unit">점</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">밝기<small>회색조에 더한다 (회색조·감열지)</small></span>
          <input type="range" data-key="brightness">
          <span class="op-value"><output data-key="brightness"></output><span class="op-unit">±</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">대비<small>0.5를 중심으로 늘린다 (회색조·감열지)</small></span>
          <input type="range" data-key="contrast">
          <span class="op-value"><output data-key="contrast"></output><span class="op-unit">배</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">감마<small>1보다 크면 중간 밝기가 밝아진다</small></span>
          <input type="range" data-key="gamma">
          <span class="op-value"><output data-key="gamma"></output><span class="op-unit">γ</span></span>
        </label>
      </fieldset>
      <fieldset class="op-group">
        <legend>미리보기 <small>느리면 초당 그림부터 낮춘다</small></legend>
        <label class="op-row">
          <span class="op-label">초당 그림<small>1초에 새로 그리는 그림 (스톱모션 느낌)</small></span>
          <input type="range" data-key="fps">
          <span class="op-value"><output data-key="fps"></output><span class="op-unit">장/초</span></span>
        </label>
        <label class="op-row">
          <span class="op-label">처리 해상도<small>결과 크기 대비. 낮추면 미리보기가 결과보다 부드럽다</small></span>
          <input type="range" data-key="previewScale">
          <span class="op-value"><output data-key="previewScale"></output><span class="op-unit">배</span></span>
        </label>
      </fieldset>
    </div>
    <footer class="op-footer">
      <p class="op-state" data-state></p>
      <div class="op-buttons">
        <button type="button" class="is-primary" data-action="save">저장</button>
        <button type="button" data-action="revert">취소 (저장된 값으로)</button>
        <button type="button" data-action="defaults">기본값으로</button>
      </div>
      <p class="op-message" data-message></p>
    </footer>
  </section>
</body>
</html>
