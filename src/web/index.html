<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 외부 전송 없음: 같은 출처만 허용한다. MediaPipe 사용 통계 전송(odml.pa.googleapis.com)도 여기서 막힌다.
       wasm-unsafe-eval: MediaPipe WASM 컴파일에 필요 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinsegae Christmas Photobooth</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="stage" class="stage">
    <video id="preview" class="preview" autoplay muted playsinline></video>
    <canvas id="dev-overlay" class="dev-overlay" hidden></canvas>
    <p id="presence" class="presence" hidden></p>
    <p id="status" class="status" hidden></p>
  </main>
  <pre id="dev-info" class="dev-info" hidden></pre>
</body>
</html>
